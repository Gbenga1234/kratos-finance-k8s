# Syncs secrets from the external provider (AWS Secrets Manager, Vault, GCP SM, ...)
# into the Kubernetes Secret "kratos-finance", which the Deployment consumes.
# Requires the External Secrets Operator (v0.17+ for external-secrets.io/v1;
# use external-secrets.io/v1beta1 on older versions).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kratos-finance
  namespace: kratos-finance
  labels:
    app.kubernetes.io/name: kratos-finance
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: REPLACE_WITH_SECRET_STORE_NAME
    kind: ClusterSecretStore
  target:
    name: kratos-finance
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: REPLACE_WITH_REMOTE_SECRET_NAME
        property: DATABASE_URL
    - secretKey: SECRET_KEY
      remoteRef:
        key: REPLACE_WITH_REMOTE_SECRET_NAME
        property: SECRET_KEY
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: REPLACE_WITH_REDIS_REMOTE_SECRET_NAME
        property: REDIS_PASSWORD
  # Alternatively, pull every key from the remote secret:
  # dataFrom:
  #   - extract:
  #       key: REPLACE_WITH_REMOTE_SECRET_NAME
