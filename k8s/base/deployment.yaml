apiVersion: apps/v1
kind: Deployment
metadata:
  name: kratos-finance
  namespace: kratos-finance
  labels:
    app: kratos-finance
    app.kubernetes.io/name: kratos-finance
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kratos-finance
  template:
    metadata:
      labels:
        app: kratos-finance
        app.kubernetes.io/name: kratos-finance
    spec:
      # imagePullSecrets:
      #   - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kratos-finance
          image: ghcr.io/REPLACE_WITH_ORG/kratos-finance:REPLACE_WITH_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kratos-finance-env
            - secretRef:
                name: kratos-finance
          # Startup: gives the app up to 150s to boot before liveness kicks in.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          # Readiness: /readyz should fail while dependencies (DB, Redis) are
          # unavailable, removing the pod from the Service without restarting it.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          # Liveness: /healthz should only check the process itself, not
          # dependencies, so an outage elsewhere doesn't restart every pod.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
