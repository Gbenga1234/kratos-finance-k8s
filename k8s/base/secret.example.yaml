# Plain Secret for local/dev clusters WITHOUT the External Secrets Operator.
# Not included in kustomization.yaml: in real clusters the ExternalSecret
# creates and owns the "kratos-finance" Secret. Do not commit real values.
#   kubectl apply -f k8s/base/secret.example.yaml
apiVersion: v1
kind: Secret
metadata:
  name: kratos-finance
  namespace: kratos-finance
  labels:
    app.kubernetes.io/name: kratos-finance
type: Opaque
stringData:
  DATABASE_URL: "postgres://user:password@postgres:5432/kratos_finance"
  SECRET_KEY: "change-me"
  REDIS_PASSWORD: "change-me"
