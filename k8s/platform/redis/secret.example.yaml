# Plain Secret for clusters WITHOUT the External Secrets Operator.
# Not included in kustomization.yaml. Do not commit real values.
#   kubectl apply -f k8s/platform/redis/secret.example.yaml
apiVersion: v1
kind: Secret
metadata:
  name: redis
  namespace: redis
  labels:
    app.kubernetes.io/name: redis
type: Opaque
stringData:
  REDIS_PASSWORD: "change-me"
