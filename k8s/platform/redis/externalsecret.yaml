# Syncs the Redis password into the Secret "redis" (key REDIS_PASSWORD).
# Apps that connect to Redis pull the same remote value in their own namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis
  namespace: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: REPLACE_WITH_SECRET_STORE_NAME
    kind: ClusterSecretStore
  target:
    name: redis
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: REPLACE_WITH_REDIS_REMOTE_SECRET_NAME
        property: REDIS_PASSWORD
