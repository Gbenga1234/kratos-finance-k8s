apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kratos-finance
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kratos-finance
  source:
    repoURL: https://github.com/Gbenga1234/kratos-finance-k8s.git
    targetRevision: main
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: kratos-finance
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
