# SigNoz Helm chart with values from this repo (multi-source, Argo CD 2.6+).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signoz
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kratos-finance
  sources:
    - repoURL: https://charts.signoz.io
      chart: signoz
      targetRevision: 0.145.0
      helm:
        releaseName: signoz
        valueFiles:
          - $values/k8s/platform/signoz/values.yaml
    - repoURL: https://github.com/Gbenga1234/kratos-finance-k8s.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: signoz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ClickHouse operator CRDs exceed the client-side apply annotation size limit.
      - ServerSideApply=true
